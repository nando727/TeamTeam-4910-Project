# Elastic Beanstalk's nginx proxy caps request bodies at 1 MB by default, which
# would reject large bulk upload files before the app ever saw them. The app
# streams uploads line by line, so there is no reason for a cap here (RC#1).
client_max_body_size 0;
# A very large file can take a while to process; keep the proxy waiting.
proxy_read_timeout 300;
